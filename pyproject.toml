[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts"
version = "0.2.0"
description = "Qwen-TTS python package (fork with updated dependencies)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]

dependencies = [
  "transformers==5.5.4",
  "accelerate==1.13.0",
  "gradio==6.12.0",
  "librosa==0.11.0",
  "torchaudio",
  "soundfile==0.13.1",
  "sox==1.5.0",
  "onnxruntime==1.24.4",
  "einops==0.8.2",
  "safetensors==0.7.0",
]

[project.urls]
Homepage = "https://github.com/tiz-sharp/Qwen3-TTS"
Repository = "https://github.com/tiz-sharp/Qwen3-TTS"

[project.scripts]
qwen-tts-demo = "qwen_tts.cli.demo:main"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_tts*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]
